constraint:
  name: secret_management
  severity: CRITICAL
  applies_when:
    action:
      - auth
      - crypto
      - payment
      - network
  rules:
    - type: FORBID_PATTERN
      pattern: "password.*=.*\"|api_key.*=.*\"|secret.*=.*\""
      message: "Hardcoded secrets detected — use environment variables or secret manager"
    - type: FORBID_PATTERN
      pattern: "print(.*key|print(.*secret|print(.*password"
      message: "Secrets must never be logged or printed"
    - type: REQUIRE_PATTERN
      pattern: "os.environ|settings.|config.|secret_manager|vault"
      message: "Secrets must be loaded from environment, config, or a secret manager"
