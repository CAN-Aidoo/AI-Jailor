[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aijailer"
version = "0.1.0"
description = "Python SDK for AI Jailer — secure isolation-as-a-service"
requires-python = ">=3.10"
license = "MIT"

dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["aijailer"]
